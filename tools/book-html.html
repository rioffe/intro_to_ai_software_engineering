<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1">
   <title>$title$</title>
   $for(header-includes)$
   $header-includes$
   $endfor$
   $if(math)$
   $math$
   $endif$
</head>
<body class="book-html">
   $for(include-before)$
   $include-before$
   $endfor$
   <!-- No $toc$ here: tools/local-toc-html.lua builds the master "Contents"
        itself and places it in the rail beside the front matter, so that it
        sits to the LEFT of the text like every chapter's local Contents. -->
   $body$
   $for(include-after)$
   $include-after$
   $endfor$
</body>
</html>
